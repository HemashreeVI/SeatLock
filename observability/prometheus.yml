global:
  scrape_interval: 5s

scrape_configs:
  - job_name: seatlock
    metrics_path: /actuator/prometheus
    static_configs:
      # app started with ./mvnw spring-boot:run on your machine
      - targets: ["host.docker.internal:8080"]
      # app started with docker compose --profile app
      - targets: ["app:8080"]
