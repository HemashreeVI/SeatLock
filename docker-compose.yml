services:
  postgres:
    image: postgres:16-alpine
    container_name: seatlock-postgres
    environment:
      POSTGRES_DB: seatlock
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: seatlock-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: