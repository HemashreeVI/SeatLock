<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 258" width="1200" height="258" role="img" aria-labelledby="tbl-t tbl-d">
<title id="tbl-t">Load Test</title>
<desc id="tbl-d">Locking strategy: Pessimistic (FOR UPDATE), Hold requests: 72,828, Throughput: 2,411 req/s, p95: 448 ms, Seats held: 100 / 100, Double-bookings: 0; Locking strategy: Optimistic (@Version), Hold requests: 65,028, Throughput: 2,148 req/s, p95: 473 ms, Seats held: 100 / 100, Double-bookings: 0; Locking strategy: Redis distributed lock, Hold requests: 75,330, Throughput: 2,491 req/s, p95: 418 ms, Seats held: 100 / 100, Double-bookings: 0</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:sr 40s linear infinite}@keyframes sr{to{transform:rotate(-360deg)}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<defs>
<radialGradient id="tbl-bg" cx="70%" cy="30%" r="90%"><stop offset="0" stop-color="#2A0F1B"/><stop offset=".55" stop-color="#170910"/><stop offset="1" stop-color="#0D0508"/></radialGradient>
<radialGradient id="tbl-glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9B1B3F" stop-opacity=".5"/><stop offset="1" stop-color="#9B1B3F" stop-opacity="0"/></radialGradient>
<radialGradient id="tbl-glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E8B04B" stop-opacity=".14"/><stop offset="1" stop-color="#E8B04B" stop-opacity="0"/></radialGradient>
<linearGradient id="tbl-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#F6D58E"/><stop offset="1" stop-color="#E8B04B"/></linearGradient>
<linearGradient id="tbl-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8B04B" stop-opacity="0"/><stop offset=".25" stop-color="#E8B04B" stop-opacity=".85"/><stop offset="1" stop-color="#E8B04B" stop-opacity="0"/></linearGradient>
<pattern id="tbl-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E8B04B" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="256" rx="22" fill="url(#tbl-bg)" stroke="#3A1626"/>
<rect x="1" y="1" width="1198" height="256" rx="22" fill="url(#tbl-grid)"/>
<ellipse cx="960" cy="77" rx="420" ry="181" fill="url(#tbl-glowA)"/>
<ellipse cx="240" cy="181" rx="300" ry="129" fill="url(#tbl-glowB)"/><rect x="40" y="40" width="1120" height="178" rx="14" fill="#1E0B14" stroke="#5A2238"/><text x="58" y="70" class="mono" font-size="11" fill="#E8B04B" text-anchor="start" letter-spacing="2">LOCKING STRATEGY</text><text x="372" y="70" class="mono" font-size="11" fill="#E8B04B" text-anchor="start" letter-spacing="2">HOLD REQUESTS</text><text x="540" y="70" class="mono" font-size="11" fill="#E8B04B" text-anchor="start" letter-spacing="2">THROUGHPUT</text><text x="708" y="70" class="mono" font-size="11" fill="#E8B04B" text-anchor="start" letter-spacing="2">P95</text><text x="842" y="70" class="mono" font-size="11" fill="#E8B04B" text-anchor="start" letter-spacing="2">SEATS HELD</text><text x="999" y="70" class="mono" font-size="11" fill="#E8B04B" text-anchor="start" letter-spacing="2">DOUBLE-BOOKINGS</text><rect x="40" y="86" width="1120" height="1.2" fill="url(#tbl-rule)"/><text x="58" y="114" class="serif" font-size="16" fill="#F4EDE4" text-anchor="start" >Pessimistic (FOR UPDATE)</text><text x="372" y="114" class="mono" font-size="13" fill="#D9CBC0" text-anchor="start" >72,828</text><text x="540" y="114" class="mono" font-size="13" fill="#D9CBC0" text-anchor="start" >2,411 req/s</text><text x="708" y="114" class="mono" font-size="13" fill="#D9CBC0" text-anchor="start" >448 ms</text><text x="842" y="114" class="mono" font-size="13" fill="#D9CBC0" text-anchor="start" >100 / 100</text><text x="999" y="114" class="mono" font-size="13" fill="#9FD8A6" text-anchor="start" font-weight="700">0</text><line x1="58" y1="130" x2="1142" y2="130" stroke="#3A1626"/><text x="58" y="158" class="serif" font-size="16" fill="#F4EDE4" text-anchor="start" >Optimistic (@Version)</text><text x="372" y="158" class="mono" font-size="13" fill="#D9CBC0" text-anchor="start" >65,028</text><text x="540" y="158" class="mono" font-size="13" fill="#D9CBC0" text-anchor="start" >2,148 req/s</text><text x="708" y="158" class="mono" font-size="13" fill="#D9CBC0" text-anchor="start" >473 ms</text><text x="842" y="158" class="mono" font-size="13" fill="#D9CBC0" text-anchor="start" >100 / 100</text><text x="999" y="158" class="mono" font-size="13" fill="#9FD8A6" text-anchor="start" font-weight="700">0</text><line x1="58" y1="174" x2="1142" y2="174" stroke="#3A1626"/><text x="58" y="202" class="serif" font-size="16" fill="#F4EDE4" text-anchor="start" >Redis distributed lock</text><text x="372" y="202" class="mono" font-size="13" fill="#D9CBC0" text-anchor="start" >75,330</text><text x="540" y="202" class="mono" font-size="13" fill="#D9CBC0" text-anchor="start" >2,491 req/s</text><text x="708" y="202" class="mono" font-size="13" fill="#D9CBC0" text-anchor="start" >418 ms</text><text x="842" y="202" class="mono" font-size="13" fill="#D9CBC0" text-anchor="start" >100 / 100</text><text x="999" y="202" class="mono" font-size="13" fill="#9FD8A6" text-anchor="start" font-weight="700">0</text>
