<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 448" width="1200" height="448" role="img" aria-labelledby="stk-t stk-d">
<title id="stk-t">SeatLock tech stack</title>
<desc id="stk-d">Language: Java 21, virtual threads; Framework: Spring Boot 4.1, Spring Data JPA, Flyway; Data: PostgreSQL 16, Redis 7, Lua scripts; Messaging: Kafka 4.1, KRaft, outbox + saga; Testing: JUnit 5, Testcontainers, k6; Ops: Docker, Prometheus, Grafana</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:sr 40s linear infinite}@keyframes sr{to{transform:rotate(-360deg)}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<defs>
<radialGradient id="stk-bg" cx="70%" cy="30%" r="90%"><stop offset="0" stop-color="#2A0F1B"/><stop offset=".55" stop-color="#170910"/><stop offset="1" stop-color="#0D0508"/></radialGradient>
<radialGradient id="stk-glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9B1B3F" stop-opacity=".5"/><stop offset="1" stop-color="#9B1B3F" stop-opacity="0"/></radialGradient>
<radialGradient id="stk-glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E8B04B" stop-opacity=".14"/><stop offset="1" stop-color="#E8B04B" stop-opacity="0"/></radialGradient>
<linearGradient id="stk-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#F6D58E"/><stop offset="1" stop-color="#E8B04B"/></linearGradient>
<linearGradient id="stk-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8B04B" stop-opacity="0"/><stop offset=".25" stop-color="#E8B04B" stop-opacity=".85"/><stop offset="1" stop-color="#E8B04B" stop-opacity="0"/></linearGradient>
<pattern id="stk-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E8B04B" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="446" rx="22" fill="url(#stk-bg)" stroke="#3A1626"/>
<rect x="1" y="1" width="1198" height="446" rx="22" fill="url(#stk-grid)"/>
<ellipse cx="600" cy="224" rx="420" ry="314" fill="url(#stk-glowA)"/>
<ellipse cx="600" cy="224" rx="300" ry="224" fill="url(#stk-glowB)"/><rect x="40" y="40" width="363" height="176" rx="16" fill="#1E0B14" stroke="#5A2238"/><text x="60" y="72" class="mono" font-size="11" fill="#E8B04B" text-anchor="start" letter-spacing="2.5">LANGUAGE</text><text x="60" y="110" class="serif" font-size="22" fill="#F4EDE4" text-anchor="start" >Java 21</text><text x="60" y="146" class="serif" font-size="17" fill="#D9CBC0" text-anchor="start" >virtual threads</text><rect x="419" y="40" width="363" height="176" rx="16" fill="#1E0B14" stroke="#5A2238"/><text x="439" y="72" class="mono" font-size="11" fill="#E8B04B" text-anchor="start" letter-spacing="2.5">FRAMEWORK</text><text x="439" y="110" class="serif" font-size="22" fill="#F4EDE4" text-anchor="start" >Spring Boot 4.1</text><text x="439" y="146" class="serif" font-size="17" fill="#D9CBC0" text-anchor="start" >Spring Data JPA</text><text x="439" y="177" class="serif" font-size="15" fill="#A8939A" text-anchor="start" >Flyway</text><rect x="797" y="40" width="363" height="176" rx="16" fill="#1E0B14" stroke="#5A2238"/><text x="817" y="72" class="mono" font-size="11" fill="#E8B04B" text-anchor="start" letter-spacing="2.5">DATA</text><text x="817" y="110" class="serif" font-size="22" fill="#F4EDE4" text-anchor="start" >PostgreSQL 16</text><text x="817" y="146" class="serif" font-size="17" fill="#D9CBC0" text-anchor="start" >Redis 7</text><text x="817" y="177" class="serif" font-size="15" fill="#A8939A" text-anchor="start" >Lua scripts</text><rect x="40" y="232" width="363" height="176" rx="16" fill="#1E0B14" stroke="#5A2238"/><text x="60" y="264" class="mono" font-size="11" fill="#E8B04B" text-anchor="start" letter-spacing="2.5">MESSAGING</text><text x="60" y="302" class="serif" font-size="22" fill="#F4EDE4" text-anchor="start" >Kafka 4.1</text><text x="60" y="338" class="serif" font-size="17" fill="#D9CBC0" text-anchor="start" >KRaft</text><text x="60" y="369" class="serif" font-size="15" fill="#A8939A" text-anchor="start" >outbox + saga</text><rect x="419" y="232" width="363" height="176" rx="16" fill="#1E0B14" stroke="#5A2238"/><text x="439" y="264" class="mono" font-size="11" fill="#E8B04B" text-anchor="start" letter-spacing="2.5">TESTING</text><text x="439" y="302" class="serif" font-size="22" fill="#F4EDE4" text-anchor="start" >JUnit 5</text><text x="439" y="338" class="serif" font-size="17" fill="#D9CBC0" text-anchor="start" >Testcontainers</text><text x="439" y="369" class="serif" font-size="15" fill="#A8939A" text-anchor="start" >k6</text><rect x="797" y="232" width="363" height="176" rx="16" fill="#1E0B14" stroke="#5A2238"/><text x="817" y="264" class="mono" font-size="11" fill="#E8B04B" text-anchor="start" letter-spacing="2.5">OPS</text><text x="817" y="302" class="serif" font-size="22" fill="#F4EDE4" text-anchor="start" >Docker</text><text x="817" y="338" class="serif" font-size="17" fill="#D9CBC0" text-anchor="start" >Prometheus</text><text x="817" y="369" class="serif" font-size="15" fill="#A8939A" text-anchor="start" >Grafana</text>
</svg>
