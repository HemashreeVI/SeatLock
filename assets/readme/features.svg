<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="feat-t feat-d">
<title id="feat-t">SeatLock features</title>
<desc id="feat-d">Concurrency control: Optimistic, pessimistic and Redis locks, switchable, backed by DB constraints.; Temporary holds: Seats are held for 10 minutes and released automatically on timeout.; Idempotent requests: Retries and double-clicks never double-book or double-charge.; Event-driven saga: Booking → payment → notification via Kafka and a transactional outbox.; Compensation: A failed payment automatically releases the reserved seats.; Seat-map caching: Served from Redis and evicted on every change.; Rate limiting: Distributed token bucket with Redis and Lua.; Virtual waiting room: FIFO queue with admission tokens for hot events.; Observability: Prometheus metrics, Grafana dashboard, trace ids in logs.; Live seat map: Server-Sent Events push seat changes to every viewer within a second.; Email notifications: Real confirmation, cancellation and expiry emails via Brevo.; Public demo: Hold, pay, cancel and race 50 buyers for 1 seat on the live site.</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:sr 40s linear infinite}@keyframes sr{to{transform:rotate(-360deg)}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<defs>
<radialGradient id="feat-bg" cx="70%" cy="30%" r="90%"><stop offset="0" stop-color="#2A0F1B"/><stop offset=".55" stop-color="#170910"/><stop offset="1" stop-color="#0D0508"/></radialGradient>
<radialGradient id="feat-glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9B1B3F" stop-opacity=".5"/><stop offset="1" stop-color="#9B1B3F" stop-opacity="0"/></radialGradient>
<radialGradient id="feat-glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E8B04B" stop-opacity=".14"/><stop offset="1" stop-color="#E8B04B" stop-opacity="0"/></radialGradient>
<linearGradient id="feat-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#F6D58E"/><stop offset="1" stop-color="#E8B04B"/></linearGradient>
<linearGradient id="feat-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8B04B" stop-opacity="0"/><stop offset=".25" stop-color="#E8B04B" stop-opacity=".85"/><stop offset="1" stop-color="#E8B04B" stop-opacity="0"/></linearGradient>
<pattern id="feat-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E8B04B" stroke-opacity=".05"/></pattern>
</defs>
